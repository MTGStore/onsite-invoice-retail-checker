<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoice Entry System - Multi-Store</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        header {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 25px;
        }
        
        h1 {
            color: #1F4E78;
            font-size: 26px;
            margin-bottom: 15px;
        }
        
        .header-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
            margin-bottom: 15px;
        }
        
        .header-field {
            display: flex;
            flex-direction: column;
        }
        
        .header-label {
            font-size: 12px;
            color: #999;
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 5px;
        }
        
        .header-input, .header-select {
            padding: 10px 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
        }
        
        .vendor-autocomplete {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 2px solid #667eea;
            border-top: none;
            border-radius: 0 0 6px 6px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 100;
            display: none;
            margin-top: -2px;
        }
        
        .vendor-autocomplete.show {
            display: block;
        }
        
        .vendor-option {
            padding: 12px 16px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 14px;
        }
        
        .vendor-option:hover {
            background: #f0f4ff;
        }
        
        .vendor-option.new {
            color: #27ae60;
            font-weight: 600;
        }
        
        .status-badge {
            display: inline-block;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            background: #d4edda;
            color: #155724;
        }
        
        .card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 25px;
        }
        
        .card h2 {
            color: #1F4E78;
            font-size: 16px;
            margin-bottom: 20px;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
        }
        
        .search-box {
            position: relative;
            margin-bottom: 20px;
        }
        
        .search-input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 0.3s;
        }
        
        .search-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 2px solid #667eea;
            border-top: none;
            border-radius: 0 0 8px 8px;
            max-height: 300px;
            overflow-y: auto;
            z-index: 1000;
            display: none;
        }
        
        .dropdown.show {
            display: block;
        }
        
        .dropdown-item {
            padding: 12px 16px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .dropdown-item:hover {
            background: #f0f4ff;
        }
        
        .dropdown-item-name {
            font-weight: 600;
            color: #1F4E78;
            margin-bottom: 3px;
            font-size: 14px;
        }
        
        .dropdown-item-meta {
            font-size: 12px;
            color: #999;
        }
        
        .invoice-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            margin-bottom: 25px;
        }
        
        @media (max-width: 900px) {
            .invoice-grid {
                grid-template-columns: 1fr;
            }
            .header-row {
                grid-template-columns: 1fr;
            }
        }
        
        .invoice-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 12px;
            border-left: 4px solid #667eea;
            display: flex;
            justify-content: space-between;
            align-items: start;
            gap: 10px;
        }
        
        .invoice-item-content {
            flex: 1;
        }
        
        .invoice-item-name {
            font-weight: 600;
            color: #1F4E78;
            margin-bottom: 5px;
            font-size: 14px;
        }
        
        .invoice-item-details {
            font-size: 13px;
            color: #666;
            margin-bottom: 5px;
            line-height: 1.5;
        }
        
        .invoice-item-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        
        .btn-edit {
            background: #667eea;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            white-space: nowrap;
        }
        
        .btn-edit:hover {
            background: #764ba2;
        }
        
        .btn-delete {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        
        .btn-delete:hover {
            background: #c0392b;
        }
        
        .summary-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 12px;
        }
        
        .summary-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }
        
        .summary-item {
            text-align: center;
        }
        
        .summary-label {
            font-size: 12px;
            opacity: 0.9;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .summary-value {
            font-size: 28px;
            font-weight: 700;
        }
        
        .margin-display {
            font-size: 48px;
            font-weight: 700;
            margin: 20px 0;
            letter-spacing: 2px;
        }
        
        .empty-state {
            text-align: center;
            color: #999;
            padding: 40px 20px;
            font-style: italic;
        }
        
        .modal {
            display: none;
            position: fixed;
            z-index: 10000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
        }
        
        .modal.show {
            display: flex;
        }
        
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 12px;
            max-width: 500px;
            width: 90%;
            max-height: 85vh;
            overflow-y: auto;
        }
        
        .modal-header {
            font-size: 18px;
            font-weight: 600;
            color: #1F4E78;
            margin-bottom: 20px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }
        
        .modal-field {
            margin-bottom: 15px;
            position: relative;
        }
        
        .modal-label {
            font-size: 12px;
            color: #999;
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 5px;
        }
        
        .modal-input, .modal-autocomplete {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }
        
        .autocomplete-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 2px solid #667eea;
            border-top: none;
            border-radius: 0 0 6px 6px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 100;
            display: none;
            margin-top: -2px;
        }
        
        .autocomplete-dropdown.show {
            display: block;
        }
        
        .autocomplete-item {
            padding: 10px 12px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 14px;
        }
        
        .autocomplete-item:hover {
            background: #f0f4ff;
        }
        
        .autocomplete-item.new {
            color: #667eea;
            font-weight: 600;
        }
        
        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }
        
        .modal-buttons button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }
        
        .btn-cancel {
            background: #e74c3c;
            color: white;
        }
        
        .btn-save {
            background: #27ae60;
            color: white;
        }
        
        .btn-cancel:hover {
            background: #c0392b;
        }
        
        .btn-save:hover {
            background: #229954;
        }
        
        .btn-clear {
            background: #e74c3c;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }
        
        .btn-clear:hover {
            background: #c0392b;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📦 Invoice Entry System - Multi-Store</h1>
            <div class="header-row">
                <div class="header-field">
                    <div class="header-label">Store / Location *</div>
                    <select id="storeLocation" class="header-select">
                        <option value="">-- Select Store --</option>
                        <option value="MTG-5 RockHill">MTG-5 RockHill</option>
                        <option value="MTG-4">MTG-4</option>
                        <option value="MTG-3">MTG-3</option>
                        <option value="MTG-2">MTG-2</option>
                        <option value="MTG-1">MTG-1</option>
                        <option value="KC MART #09">KC MART #09</option>
                        <option value="KC Mart 6">KC Mart 6</option>
                        <option value="KC-4">KC-4</option>
                        <option value="QuickStop">QuickStop</option>
                        <option value="SQS">SQS</option>
                    </select>
                </div>
                <div class="header-field">
                    <div class="header-label">Vendor *</div>
                    <div style="position: relative;">
                        <input type="text" id="vendorInput" class="header-input" placeholder="Type vendor name...">
                        <div class="vendor-autocomplete" id="vendorAutocomplete"></div>
                    </div>
                </div>
                <div class="header-field">
                    <div class="header-label">Invoice Number</div>
                    <input type="text" id="invoiceNumber" class="header-input" placeholder="e.g., 47101796007">
                </div>
            </div>
            <div class="header-row">
                <div class="header-field">
                    <div class="header-label">Invoice Date</div>
                    <input type="date" id="invoiceDate" class="header-input">
                </div>
                <div style="grid-column: 2/4;"></div>
            </div>
            <div style="margin-top: 15px;">
                <span class="status-badge" id="statusBadge">⏳ Loading...</span>
            </div>
        </header>
        
        <div class="card">
            <h2>🔍 Add Product to Invoice</h2>
            <div class="search-box">
                <input type="text" id="searchInput" class="search-input" placeholder="Search by Product Name, UPC, or Item ID...">
                <div class="dropdown" id="dropdown"></div>
            </div>
        </div>
        
        <div class="invoice-grid">
            <div class="card">
                <h2>📋 Invoice Items</h2>
                <div id="invoiceItems">
                    <div class="empty-state">No items added yet. Search and add products above.</div>
                </div>
            </div>
            
            <div class="card">
                <div class="summary-card">
                    <div class="summary-row">
                        <div class="summary-item">
                            <div class="summary-label">Total Cost</div>
                            <div class="summary-value" id="totalCost">$0.00</div>
                        </div>
                        <div class="summary-item">
                            <div class="summary-label">Total Retail</div>
                            <div class="summary-value" id="totalRetail">$0.00</div>
                        </div>
                        <div class="summary-item">
                            <div class="summary-label">Items</div>
                            <div class="summary-value" id="itemCount">0</div>
                        </div>
                    </div>
                    <div style="text-align: center; border-top: 1px solid rgba(255,255,255,0.3); padding-top: 20px;">
                        <div class="summary-label">INVOICE MARGIN</div>
                        <div class="margin-display" id="invoiceMargin">0%</div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="card">
            <button class="btn-clear" onclick="clearInvoice()">🗑️ Clear All Items</button>
        </div>
    </div>

    <!-- Edit Modal -->
    <div class="modal" id="editModal">
        <div class="modal-content">
            <div class="modal-header" id="modalHeader">Edit Product</div>
            <div id="editFormContent"></div>
            <div class="modal-buttons">
                <button class="btn-cancel" onclick="closeEditModal()">Cancel</button>
                <button class="btn-save" id="saveBtn" onclick="saveProduct()">Save</button>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // GOOGLE APPS SCRIPT WEB APP URL
        // ============================================
        
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycby2teM6vivyM4qWLHN3ddXLB9Djs8g8N8oXns7IzYG7LWJyvqJQjFwTiGUxb3tOE-N8-Q/exec';
        
        let allProducts = [];
        let storeVendors = [];
        let currentInvoice = [];
        let currentStore = '';
        let editingIndex = null;
        let currentSearchResults = [];

        // ============================================
        // LOAD STORE DATA
        // ============================================
        
        async function loadStore(storeName) {
            try {
                if (!storeName) {
                    document.getElementById('statusBadge').textContent = '⚠️ Please select a store';
                    return;
                }
                
                currentStore = storeName;
                document.getElementById('statusBadge').textContent = '⏳ Loading ' + storeName + '...';
                document.getElementById('searchInput').value = '';
                
                // Load products
                const productsResponse = await fetch(WEB_APP_URL + '?store=' + encodeURIComponent(storeName));
                const products = await productsResponse.json();
                
                // Load vendors
                const vendorsResponse = await fetch(WEB_APP_URL + '?action=getVendors&store=' + encodeURIComponent(storeName));
                const vendors = await vendorsResponse.json();
                
                if (Array.isArray(products) && products.length > 0) {
                    allProducts = products;
                    storeVendors = Array.isArray(vendors) ? vendors : [];
                    
                    console.log(`✅ Loaded ${allProducts.length} products and ${storeVendors.length} vendors for ${storeName}`);
                    document.getElementById('statusBadge').textContent = `✅ ${storeName} - ${allProducts.length} products`;
                    
                    // Clear invoice on store change
                    currentInvoice = [];
                    updateInvoiceDisplay();
                } else {
                    document.getElementById('statusBadge').textContent = `ℹ️ No products for ${storeName}`;
                }
                
            } catch (error) {
                console.error('Error loading store:', error);
                document.getElementById('statusBadge').innerHTML = '⚠️ Connection error';
            }
        }

        // ============================================
        // VENDOR AUTOCOMPLETE
        // ============================================
        
        // Vendor input autocomplete
        document.addEventListener('DOMContentLoaded', function() {
            const vendorInput = document.getElementById('vendorInput');
            const vendorAutocomplete = document.getElementById('vendorAutocomplete');
            
            vendorInput.addEventListener('input', function(e) {
                const searchTerm = e.target.value.trim().toLowerCase();
                
                if (!searchTerm) {
                    vendorAutocomplete.classList.remove('show');
                    return;
                }
                
                // Find matching vendors
                const matches = storeVendors.filter(v => v.toLowerCase().includes(searchTerm));
                
                let html = '';
                
                // Show matching vendors
                matches.forEach(vendor => {
                    html += `<div class="vendor-option" onclick="selectVendor('${vendor.replace(/'/g, "\\'")}'); return false;">${vendor}</div>`;
                });
                
                // Show "Add new" option if exact match not found
                if (!matches.some(v => v.toLowerCase() === searchTerm)) {
                    html += `<div class="vendor-option new" onclick="addNewVendor('${searchTerm.replace(/'/g, "\\'")}'); return false;">➕ Add new: ${searchTerm}</div>`;
                }
                
                vendorAutocomplete.innerHTML = html;
                vendorAutocomplete.classList.add('show');
            });
            
            // Close autocomplete when clicking outside (but allow clicks on options)
            document.addEventListener('click', function(e) {
                if (e.target.id !== 'vendorInput' && !e.target.classList.contains('vendor-option')) {
                    vendorAutocomplete.classList.remove('show');
                }
            });
            
            // Prevent closing on vendor option clicks
            vendorAutocomplete.addEventListener('click', function(e) {
                e.stopPropagation();
            });
        });
        
        function selectVendor(vendor) {
            document.getElementById('vendorInput').value = vendor;
            document.getElementById('vendorAutocomplete').classList.remove('show');
            return false;
        }
        
        function addNewVendor(vendor) {
            const vendorName = vendor.trim();
            
            if (storeVendors.includes(vendorName)) {
                alert('This vendor already exists!');
                return false;
            }
            
            // Add vendor to list
            storeVendors.push(vendorName);
            storeVendors.sort();
            
            // Set the vendor input to the new vendor
            document.getElementById('vendorInput').value = vendorName;
            document.getElementById('vendorAutocomplete').classList.remove('show');
            
            // Show confirmation message
            const statusBadge = document.getElementById('statusBadge');
            const originalText = statusBadge.textContent;
            statusBadge.textContent = `✅ Vendor "${vendorName}" added! (Will save when you add first product)`;
            statusBadge.style.background = '#d4edda';
            statusBadge.style.color = '#155724';
            
            // Revert message after 4 seconds
            setTimeout(() => {
                statusBadge.textContent = originalText;
            }, 4000);
            
            console.log('✅ Added vendor:', vendorName);
            return false;
        }
        
        // Store selection change
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('storeLocation').addEventListener('change', function(e) {
                if (e.target.value) {
                    loadStore(e.target.value);
                }
            });
            
            // Set today's date
            document.getElementById('invoiceDate').valueAsDate = new Date();
        });

        // ============================================
        // SEARCH PRODUCTS
        // ============================================
        
        document.getElementById('searchInput').addEventListener('input', function(e) {
            const searchTerm = e.target.value.trim().toLowerCase();
            const dropdown = document.getElementById('dropdown');
            
            if (!searchTerm) {
                dropdown.classList.remove('show');
                return;
            }
            
            currentSearchResults = allProducts.filter(p => 
                p.upc.toLowerCase().includes(searchTerm) ||
                (p.itemid && p.itemid.toLowerCase().includes(searchTerm)) ||
                p.name.toLowerCase().includes(searchTerm)
            ).slice(0, 15);
            
            if (currentSearchResults.length === 0) {
                dropdown.innerHTML = '<div class="dropdown-item" onclick="showAddNewProductModal()" style="cursor: pointer; color: #667eea; font-weight: 600;">➕ Add New Product</div>';
                dropdown.classList.add('show');
                return;
            }
            
            let html = '';
            currentSearchResults.forEach((product, idx) => {
                html += `
                <div class="dropdown-item" onclick="selectProduct(${idx})">
                    <div class="dropdown-item-name">${product.name}</div>
                    <div class="dropdown-item-meta">UPC: ${product.upc} | ${product.vendor} | $${product.cost.toFixed(2)}/case</div>
                </div>
                `;
            });
            
            dropdown.innerHTML = html;
            dropdown.classList.add('show');
        });

        document.addEventListener('click', function(e) {
            if (e.target.id !== 'searchInput') {
                document.getElementById('dropdown').classList.remove('show');
            }
        });

        function selectProduct(index) {
            const product = currentSearchResults[index];
            document.getElementById('searchInput').value = '';
            document.getElementById('dropdown').classList.remove('show');
            
            currentInvoice.push({
                ...product,
                qty: 1
            });
            
            updateInvoiceDisplay();
        }

        // ============================================
        // DISPLAY INVOICE
        // ============================================
        
        function updateInvoiceDisplay() {
            const itemsDiv = document.getElementById('invoiceItems');
            
            if (currentInvoice.length === 0) {
                itemsDiv.innerHTML = '<div class="empty-state">No items added yet. Search and add products above.</div>';
                updateSummary();
                return;
            }
            
            let html = '';
            let totalCost = 0;
            let totalRetail = 0;
            
            currentInvoice.forEach((item, idx) => {
                const lineCost = item.qty * item.cost;
                const lineRetail = item.qty * item.units * item.retail;
                totalCost += lineCost;
                totalRetail += lineRetail;
                
                const margin = lineRetail > 0 ? ((lineRetail - lineCost) / lineRetail * 100).toFixed(1) : 0;
                const unitCost = (item.cost / item.units).toFixed(2);
                
                html += `
                <div class="invoice-item">
                    <div class="invoice-item-content">
                        <div class="invoice-item-name">${item.name}</div>
                        <div class="invoice-item-details">
                            <strong>${item.qty}</strong> case(s) @ <strong>$${item.cost.toFixed(2)}/case</strong> = $${unitCost}/unit<br>
                            <strong>${item.qty * item.units}</strong> units @ <strong>$${item.retail.toFixed(2)}/unit</strong> = <strong style="color: #27ae60;">$${lineRetail.toFixed(2)} retail</strong><br>
                            <small style="color: #999;">${item.vendor} | UPC: ${item.upc} | Margin: <strong>${margin}%</strong></small>
                        </div>
                    </div>
                    <div class="invoice-item-buttons">
                        <button class="btn-edit" onclick="editProduct(${idx})">✎ Edit</button>
                        <button class="btn-delete" onclick="removeItem(${idx})">×</button>
                    </div>
                </div>
                `;
            });
            
            itemsDiv.innerHTML = html;
            
            document.getElementById('totalCost').textContent = '$' + totalCost.toFixed(2);
            document.getElementById('totalRetail').textContent = '$' + totalRetail.toFixed(2);
            document.getElementById('itemCount').textContent = currentInvoice.length;
            
            const margin = totalRetail > 0 ? ((totalRetail - totalCost) / totalRetail * 100).toFixed(1) : 0;
            document.getElementById('invoiceMargin').textContent = margin + '%';
        }

        function removeItem(idx) {
            currentInvoice.splice(idx, 1);
            updateInvoiceDisplay();
        }

        function editProduct(idx) {
            editingIndex = idx;
            const product = currentInvoice[idx];
            
            document.getElementById('modalHeader').textContent = 'Edit Product';
            document.getElementById('saveBtn').textContent = 'Save Changes';
            
            let html = `
                <div class="modal-field">
                    <div class="modal-label">Product Name</div>
                    <input type="text" id="edit_name" class="modal-input" value="${product.name}">
                </div>
                <div class="modal-field">
                    <div class="modal-label">UPC</div>
                    <input type="text" id="edit_upc" class="modal-input" value="${product.upc}">
                </div>
                <div class="modal-field">
                    <div class="modal-label">Item ID</div>
                    <input type="text" id="edit_itemid" class="modal-input" value="${product.itemid || ''}">
                </div>
                <div class="modal-field">
                    <div class="modal-label">Vendor</div>
                    <input type="text" id="edit_vendor" class="modal-input" value="${product.vendor || ''}" placeholder="Type vendor name">
                </div>
                <div class="modal-field">
                    <div class="modal-label">Quantity (Cases)</div>
                    <input type="number" id="edit_qty" class="modal-input" value="${product.qty}" min="1" step="1">
                </div>
                <div class="modal-field">
                    <div class="modal-label">Cost Per Case</div>
                    <input type="number" id="edit_cost" class="modal-input" value="${product.cost.toFixed(2)}" step="0.01">
                </div>
                <div class="modal-field">
                    <div class="modal-label">Retail Price Per Unit</div>
                    <input type="number" id="edit_retail" class="modal-input" value="${product.retail.toFixed(2)}" step="0.01">
                </div>
                <div class="modal-field">
                    <div class="modal-label">Units Per Case</div>
                    <input type="number" id="edit_units" class="modal-input" value="${product.units}" step="1">
                </div>
            `;
            
            document.getElementById('editFormContent').innerHTML = html;
            document.getElementById('editModal').classList.add('show');
        }

        function showAddNewProductModal() {
            editingIndex = -1;
            
            document.getElementById('modalHeader').textContent = 'Add New Product';
            document.getElementById('saveBtn').textContent = 'Add to Invoice';
            
            let html = `
                <div class="modal-field">
                    <div class="modal-label">Product Name *</div>
                    <input type="text" id="edit_name" class="modal-input" placeholder="">
                </div>
                <div class="modal-field">
                    <div class="modal-label">UPC *</div>
                    <input type="text" id="edit_upc" class="modal-input" placeholder="">
                </div>
                <div class="modal-field">
                    <div class="modal-label">Item ID</div>
                    <input type="text" id="edit_itemid" class="modal-input" placeholder="">
                </div>
                <div class="modal-field">
                    <div class="modal-label">Vendor * (Type to search existing)</div>
                    <div style="position: relative;">
                        <input type="text" id="edit_vendor" class="modal-input" placeholder="Start typing...">
                        <div class="autocomplete-dropdown" id="vendorDropdown"></div>
                    </div>
                </div>
                <div class="modal-field">
                    <div class="modal-label">Quantity (Cases) *</div>
                    <input type="number" id="edit_qty" class="modal-input" value="1" min="1" step="1">
                </div>
                <div class="modal-field">
                    <div class="modal-label">Cost Per Case *</div>
                    <input type="number" id="edit_cost" class="modal-input" value="0" step="0.01">
                </div>
                <div class="modal-field">
                    <div class="modal-label">Retail Price Per Unit *</div>
                    <input type="number" id="edit_retail" class="modal-input" value="0" step="0.01">
                </div>
                <div class="modal-field">
                    <div class="modal-label">Units Per Case *</div>
                    <input type="number" id="edit_units" class="modal-input" value="24" step="1">
                </div>
            `;
            
            document.getElementById('editFormContent').innerHTML = html;
            document.getElementById('editModal').classList.add('show');
            
            // Vendor autocomplete
            const vendorInput = document.getElementById('edit_vendor');
            const vendorDropdown = document.getElementById('vendorDropdown');
            
            vendorInput.addEventListener('input', function(e) {
                const searchTerm = e.target.value.trim().toLowerCase();
                
                if (!searchTerm) {
                    vendorDropdown.classList.remove('show');
                    return;
                }
                
                const matches = storeVendors.filter(v => v.toLowerCase().includes(searchTerm));
                
                let html = '';
                
                // Show matching vendors
                matches.forEach(vendor => {
                    html += `<div class="autocomplete-item" onclick="selectVendor('${vendor}')">${vendor}</div>`;
                });
                
                // Show "Add new" option if not exact match
                if (!matches.some(v => v.toLowerCase() === searchTerm)) {
                    html += `<div class="autocomplete-item new" onclick="selectVendor('${searchTerm}')">➕ Add new: ${searchTerm}</div>`;
                }
                
                vendorDropdown.innerHTML = html;
                vendorDropdown.classList.add('show');
            });
            
            document.addEventListener('click', function(e) {
                if (e.target.id !== 'edit_vendor') {
                    vendorDropdown.classList.remove('show');
                }
            });
            
            setTimeout(() => document.getElementById('edit_name').focus(), 100);
        }

        function selectVendor(vendor) {
            document.getElementById('edit_vendor').value = vendor;
            document.getElementById('vendorDropdown').classList.remove('show');
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.remove('show');
            editingIndex = null;
        }

        function saveProduct() {
            const name = document.getElementById('edit_name').value.trim();
            const upc = document.getElementById('edit_upc').value.trim();
            const cost = parseFloat(document.getElementById('edit_cost').value);
            const retail = parseFloat(document.getElementById('edit_retail').value);
            const vendor = document.getElementById('edit_vendor').value.trim();
            
            if (!name || !upc || cost <= 0 || retail <= 0 || !vendor) {
                alert('Please fill in all required fields (*)');
                return;
            }
            
            if (editingIndex === -1) {
                // New product - save to Google Sheet
                const newProduct = {
                    name: name,
                    upc: upc,
                    itemid: document.getElementById('edit_itemid').value.trim(),
                    vendor: vendor,
                    category: '',
                    qty: parseInt(document.getElementById('edit_qty').value),
                    cost: cost,
                    retail: retail,
                    units: parseInt(document.getElementById('edit_units').value)
                };
                
                // Save to Google Sheet
                saveProductToSheet(currentStore, newProduct);
                
                currentInvoice.push(newProduct);
                
                // Add vendor if new
                if (!storeVendors.includes(vendor)) {
                    storeVendors.push(vendor);
                    storeVendors.sort();
                }
                
                alert('✅ Product added and saved!');
            } else {
                // Edit existing
                const product = currentInvoice[editingIndex];
                product.name = name;
                product.upc = upc;
                product.itemid = document.getElementById('edit_itemid').value.trim();
                product.vendor = vendor;
                product.qty = parseInt(document.getElementById('edit_qty').value);
                product.cost = cost;
                product.retail = retail;
                product.units = parseInt(document.getElementById('edit_units').value);
            }
            
            closeEditModal();
            updateInvoiceDisplay();
        }
        
        // Save product to Google Sheet
        async function saveProductToSheet(store, product) {
            try {
                const payload = {
                    store: store,
                    upc: product.upc,
                    name: product.name,
                    vendor: product.vendor,
                    category: product.category || '',
                    units: product.units,
                    cost: product.cost,
                    retail: product.retail,
                    itemid: product.itemid || ''
                };
                
                const response = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                
                const result = await response.json();
                
                if (result.success) {
                    console.log('✅ Product and Vendor saved to Google Sheet:', product.name, product.vendor);
                    
                    // Show confirmation
                    const statusBadge = document.getElementById('statusBadge');
                    const originalText = statusBadge.textContent;
                    statusBadge.textContent = `✅ Saved: "${product.name}" with vendor "${product.vendor}"`;
                    statusBadge.style.background = '#d4edda';
                    statusBadge.style.color = '#155724';
                    
                    // Revert after 3 seconds
                    setTimeout(() => {
                        statusBadge.textContent = originalText;
                    }, 3000);
                } else {
                    console.error('Failed to save:', result);
                }
                
            } catch (error) {
                console.error('Error saving to Google Sheet:', error);
            }
        }

        function clearInvoice() {
            if (currentInvoice.length === 0) return;
            if (confirm('Clear all items?')) {
                currentInvoice = [];
                document.getElementById('searchInput').value = '';
                updateInvoiceDisplay();
            }
        }

        function updateSummary() {
            document.getElementById('totalCost').textContent = '$0.00';
            document.getElementById('totalRetail').textContent = '$0.00';
            document.getElementById('itemCount').textContent = '0';
            document.getElementById('invoiceMargin').textContent = '0%';
        }
    </script>
</body>
</html>
